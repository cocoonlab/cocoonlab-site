    <script id="language">
      // Before anything paints, open the page in the visitor's language:
      // ?lang first, then the /fr/ path, then the choice made with the
      // toggle, then, on arrival from outside the site, the browser's language.
      (function () {
        var l = window.location;
        if (!/^https?:$/.test(l.protocol)) return;
        var query = new URLSearchParams(l.search);
        var asked = query.get("lang");
        var stored = null;
        try {
          stored = window.localStorage.getItem("cocoon_language");
        } catch (e) {}
        var arriving = document.referrer.indexOf(l.origin + "/") !== 0;
        var want =
          asked === "en" || asked === "fr" ? asked
          : /^\/fr(\/|$)/.test(l.pathname) ? "fr"
          : stored === "en" || stored === "fr" ? stored
          : arriving && /^fr/i.test(navigator.language || "") ? "fr"
          : "en";
        if (asked !== null) {
          query.delete("lang");
          try {
            if (want === asked) window.localStorage.setItem("cocoon_language", asked);
          } catch (e) {}
        }
        var bare = l.pathname.replace(/^\/fr(?=\/|$)/, "") || "/";
        var path = want === "fr" ? "/fr" + bare : bare;
        var rest = (query.toString() ? "?" + query : "") + l.hash;
        if (path !== l.pathname) l.replace(path + rest);
        else if (asked !== null) window.history.replaceState(null, "", path + rest);
      })();
    </script>
